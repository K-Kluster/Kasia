  build-ios-app:
    runs-on: macos-14
    env:
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    needs: build-web-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: "npm"

      # install xcode (not xcode cli)
      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up signing keychain
        shell: bash
        run: |
          KEYCHAIN_NAME=build.keychain-db
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"

          # Create & unlock a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"


          echo "$IOS_CERTIFICATE" | (base64 --decode 2>/dev/null || base64 -d 2>/dev/null || base64 -D) > signing.p12

          test -s signing.p12 || { echo "Decoded signing.p12 is empty"; exit 1; }
          file signing.p12 || true

          /usr/bin/openssl pkcs12 -in signing.p12 -nokeys -passin pass:"$IOS_CERTIFICATE_PASSWORD" -info >/dev/null 2>&1 \
            || { echo "signing.p12 not readable with provided IOS_CERTIFICATE_PASSWORD"; exit 1; }

          # Import the .p12 (certificate + private key)
          security import signing.p12 \
            -k "$KEYCHAIN_PATH" \
            -f pkcs12 \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          # Allow Apple tools to access the private key non-interactively
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          # verify identities
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      # get web-app artifacts
      - name: Get Web App Artifact
        id: get-web-app-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              name: 'kasia-build-${{ env.SUFFIX }}',
              sort: 'created',
              order: 'desc',
            });
            return artifacts.data.artifacts[0].workflow_run.id;

      - name: Restore Web App artifact
        uses: actions/download-artifact@v4
        with:
          name: kasia-build-${{ env.SUFFIX }}
          path: dist
          github-token: ${{ secrets.GH_PAT_READ_ACTIONS }}
          run-id: ${{ steps.get-web-app-artifact.outputs.result }}

      # install @tauri-apps/cli@latest
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Install Homebrew
        run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Install Typescript CLI
        run: npm install -g typescript

      - name: Remove Tauri Before Build property
        run: sed -i '/"beforeBuildCommand":/d' tauri.conf.json

      - name: Build App
        run: tauri ios build -- --export-method app-store-connect

      - name: Get Tauri App Version
        id: app-version
        run: |
          CARGO_TOML_PATH="src-tauri/Cargo.toml"
          echo "Attempting to read version from $CARGO_TOML_PATH"

          if [ ! -f "$CARGO_TOML_PATH" ]; then
            echo "Error: $CARGO_TOML_PATH not found."
            exit 1
          fi

          echo "--- Relevant content from $CARGO_TOML_PATH (looking for 'version = \"...' line) ---"
          grep '^version = "' "$CARGO_TOML_PATH" || echo "No line starting with 'version = \"' found in $CARGO_TOML_PATH."
          echo "--- End of relevant content ---"

          # Extract version string from Cargo.toml.
          # This looks for a line like 'version = "x.y.z"' in the [package] section.
          VERSION_STRING=$(grep '^version = "' "$CARGO_TOML_PATH" | head -n 1 | sed -e 's/version = "//' -e 's/"//')

          echo "Extracted version_string: '$VERSION_STRING'" # Debug output

          if [ -z "$VERSION_STRING" ] || [ "$VERSION_STRING" = "null" ]; then # Check for empty or literal "null"
            echo "Error: Version not found or is invalid in $CARGO_TOML_PATH."
            echo "Please ensure $CARGO_TOML_PATH contains a line like 'version = \"x.y.z\"' (typically under the [package] section)."
            exit 1
          fi

          echo "Successfully extracted version: $VERSION_STRING"
          echo "version_string=$VERSION_STRING" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Rename iOS IPA file
        run: |
          mv ./src-tauri/gen/apple/build/arm64/kasia.ipa ./src-tauri/apple/build/arm64/kasia-${{ steps.app-version.outputs.version_string }}.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasia-ios-${{ env.SUFFIX }}
          path: ./src-tauri/gen/ios/app/build/Release-iphoneos/kasia-${{ steps.app-version.outputs.version_string }}.ipa
